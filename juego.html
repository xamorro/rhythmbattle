<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Battle Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-back {
            display: inline-block;
            margin-top: 15px;
            color: rgba(136,120,170,0.8);
            text-decoration: none;
            font-size: 12px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            padding: 6px 14px;
            border: 1px solid rgba(168,85,247,0.2);
            border-radius: 6px;
        }
        .nav-back:hover {
            color: #ff3a50;
            border-color: rgba(255,58,80,0.4);
            box-shadow: 0 0 10px rgba(255,58,80,0.15);
        }
        .highscore-ui-color { color: #ffaa00 !important; }

        #game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 22px 0 10px;
            background: linear-gradient(135deg, #ffffff 0%, #c8a8ff 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 15px rgba(168,85,247,0.3));
        }
    </style>
</head>
<body>

    <h1 id="game-title">⚔️ Rhythm Battle Arena ⚔️</h1>
    
    <div id="battle-ui">
        <div class="ui-box">
            <h3 id="heart-title">❤️ Tu Vida</h3>
            <div id="player-hearts">❤️❤️❤️</div>
        </div>
        
        <div id="boss-zone">
            <div id="boss-active-ui">
                <h3 id="boss-name">👿 Rey Ritmo</h3>
                <div id="boss-health-bar"><div id="boss-health-fill"></div></div>
                <div id="boss-dialogue">"¡Prepárate para el ritmo!"</div>
            </div>
            <div id="game-message" style="display: none;"></div>
        </div>

        <div class="ui-box">
            <h3 id="score-title">⚔️ Combos Completados</h3>
            <div id="combo-counter" style="font-size: 24px; font-weight: bold; color: #ffa502;">0 / 10</div>
        </div>
    </div>

    <div id="main-layout">
        <div id="game-area">
            <button id="start-btn">¡Empezar Batalla!</button>
            <button id="next-boss-btn" style="display: none;">Siguiente Jefe</button>
            
            <div id="game-container">
                <div id="lane-S" class="lane"></div>
                <div id="lane-D" class="lane"></div>
                <div id="lane-K" class="lane"></div>
                <div id="lane-L" class="lane"></div>
                
                <div id="hit-bar"></div>
                
                <div class="key-indicator" style="left:0%;">S</div>
                <div class="key-indicator" style="left:25%;">D</div>
                <div class="key-indicator" style="left:50%;">K</div>
                <div class="key-indicator" style="left:75%;">L</div>
            </div>
            
            <a href="seleccion_boss.html" class="nav-back">⬅️ Volver a Selección de Jefe</a>
        </div>
    </div>

    <!-- Botón flotante para mutear/reproducir música de fondo -->
    <button id="mute-music-btn" class="mute-music-btn campana-theme">🎵</button>

    <script src="juego.js"></script>
</body>
</html>
