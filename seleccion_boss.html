<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Battle Arena - Selección de Jefe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-back {
            display: inline-block;
            margin-top: 25px;
            color: rgba(136,120,170,0.8);
            text-decoration: none;
            font-size: 13px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.2s;
            padding: 8px 16px;
            border: 1px solid rgba(168,85,247,0.2);
            border-radius: 6px;
        }
        .nav-back:hover {
            color: #ff3a50;
            border-color: rgba(255,58,80,0.4);
            box-shadow: 0 0 12px rgba(255,58,80,0.15);
        }

        .page-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #c8a8ff 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(168,85,247,0.35));
            margin-top: 38px;
            margin-bottom: 0;
        }

        .page-subtitle {
            color: rgba(136,120,170,0.8);
            font-style: italic;
            margin-bottom: 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="boss-selection-wrapper">
        <h1 class="page-title">⚔ SELECCIÓN DE JEFE ⚔</h1>
        <p class="page-subtitle">Derrota a cada jefe para desbloquear el siguiente reto musical</p>

        <div class="boss-grid" id="boss-grid">
            <!-- Boss 1 -->
            <a id="boss-1-link" href="#" class="boss-card">
                <div class="boss-circle">
                    <img src="fotos/boss_1.png" alt="Rey Ritmo" class="boss-img">
                    <div class="status-badge" id="boss-1-badge"></div>
                </div>
                <div class="boss-label">1. Rey Ritmo</div>
            </a>

            <!-- Boss 2 -->
            <a id="boss-2-link" href="#" class="boss-card">
                <div class="boss-circle">
                    <img src="fotos/boss_2.png" alt="Reina Melodía" class="boss-img">
                    <div class="status-badge" id="boss-2-badge"></div>
                </div>
                <div class="boss-label">2. Reina Melodía</div>
            </a>

            <!-- Boss 3 -->
            <a id="boss-3-link" href="#" class="boss-card">
                <div class="boss-circle">
                    <img src="fotos/boss_3.png" alt="Sintetizador Supremo" class="boss-img">
                    <div class="status-badge" id="boss-3-badge"></div>
                </div>
                <div class="boss-label">3. Sintetizador Supremo</div>
            </a>

            <!-- Bosses 4 a 9 (Próximamente / Bloqueados permanentes) -->
            <div class="boss-card coming-soon">
                <div class="boss-circle">
                    <span class="emoji">🔒</span>
                    <div class="status-badge">🔒</div>
                </div>
                <div class="boss-label">Próximamente</div>
            </div>

            <div class="boss-card coming-soon">
                <div class="boss-circle">
                    <span class="emoji">🔒</span>
                    <div class="status-badge">🔒</div>
                </div>
                <div class="boss-label">Próximamente</div>
            </div>

            <div class="boss-card coming-soon">
                <div class="boss-circle">
                    <span class="emoji">🔒</span>
                    <div class="status-badge">🔒</div>
                </div>
                <div class="boss-label">Próximamente</div>
            </div>

            <div class="boss-card coming-soon">
                <div class="boss-circle">
                    <span class="emoji">🔒</span>
                    <div class="status-badge">🔒</div>
                </div>
                <div class="boss-label">Próximamente</div>
            </div>

            <div class="boss-card coming-soon">
                <div class="boss-circle">
                    <span class="emoji">🔒</span>
                    <div class="status-badge">🔒</div>
                </div>
                <div class="boss-label">Próximamente</div>
            </div>

            <div class="boss-card coming-soon">
                <div class="boss-circle">
                    <span class="emoji">🔒</span>
                    <div class="status-badge">🔒</div>
                </div>
                <div class="boss-label">Próximamente</div>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn-reset-prog" onclick="resetProgress()">🔄 Reiniciar Progreso</button>
        </div>

        <a href="menu.html" class="nav-back">⬅️ Volver al Menú Principal</a>
    </div>

    <script>
        // Lógica de desbloqueo y estado de los bosses
        const boss2Unlocked = localStorage.getItem('boss_2_unlocked') === 'true';
        const boss3Unlocked = localStorage.getItem('boss_3_unlocked') === 'true';
        const boss4Unlocked = localStorage.getItem('boss_4_unlocked') === 'true';

        // Configuración Boss 1
        const card1 = document.getElementById('boss-1-link');
        const badge1 = document.getElementById('boss-1-badge');
        if (boss2Unlocked) {
            card1.className = "boss-card unlocked";
            badge1.innerText = "✅";
        } else {
            card1.className = "boss-card current";
            badge1.innerText = "🎯";
        }
        card1.href = "juego.html?boss=1";

        // Configuración Boss 2
        const card2 = document.getElementById('boss-2-link');
        const badge2 = document.getElementById('boss-2-badge');
        if (boss2Unlocked) {
            if (boss3Unlocked) {
                card2.className = "boss-card unlocked";
                badge2.innerText = "✅";
            } else {
                card2.className = "boss-card current";
                badge2.innerText = "🎯";
            }
            card2.href = "juego.html?boss=2";
        } else {
            card2.className = "boss-card locked";
            badge2.innerText = "🔒";
            card2.removeAttribute('href');
        }

        // Configuración Boss 3
        const card3 = document.getElementById('boss-3-link');
        const badge3 = document.getElementById('boss-3-badge');
        if (boss3Unlocked) {
            if (boss4Unlocked) {
                card3.className = "boss-card unlocked";
                badge3.innerText = "✅";
            } else {
                card3.className = "boss-card current";
                badge3.innerText = "🎯";
            }
            card3.href = "juego.html?boss=3";
        } else {
            card3.className = "boss-card locked";
            badge3.innerText = "🔒";
            card3.removeAttribute('href');
        }

        // Función para reiniciar el progreso de desbloqueos
        function resetProgress() {
            if (confirm("¿Estás seguro de que quieres reiniciar tu progreso en la campaña? Esto bloqueará de nuevo a los jefes 2 y 3.")) {
                localStorage.removeItem('boss_2_unlocked');
                localStorage.removeItem('boss_3_unlocked');
                localStorage.removeItem('boss_4_unlocked');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
