<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Creador de Mapas - Rhythm Battle Arena</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        #audio-panel {
            background: #161224;
            padding: 35px;
            border-radius: 10px;
            width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid rgba(46, 213, 115, 0.3);
            box-shadow: 0 0 25px rgba(46, 213, 115, 0.08);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        #audio-panel:hover {
            border-color: #2ed573;
            box-shadow: 0 0 30px rgba(46, 213, 115, 0.15);
        }
        
        #editor-panel {
            background: #161224;
            padding: 35px;
            border-radius: 10px;
            width: 380px;
            text-align: left;
            border: 2px solid rgba(46, 213, 115, 0.3);
            box-shadow: 0 0 25px rgba(46, 213, 115, 0.08);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        #editor-panel:hover {
            border-color: #2ed573;
            box-shadow: 0 0 30px rgba(46, 213, 115, 0.15);
        }
        
        .file-select-zone {
            border: 2px dashed rgba(46, 213, 115, 0.4);
            padding: 35px 20px;
            border-radius: 8px;
            width: 100%;
            text-align: center;
            margin-bottom: 25px;
            background: #110e1a;
            cursor: pointer;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        
        .file-select-zone:hover {
            border-color: #2ed573;
            background: rgba(46, 213, 115, 0.05);
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.15);
        }
        
        input[type="file"] {
            display: none;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #110e1a;
            border: 2px solid #3d2f5c;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #2ed573;
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.3);
        }

        .pad-container {
            display: flex;
            justify-content: space-between;
            margin: 20px 0;
        }

        .pad {
            width: 65px;
            height: 65px;
            border: 3px solid #3d2f5c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            background: #110e1a;
            color: #a5b1c2;
            transition: all 0.08s ease;
            user-select: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .pad.active-S { background: #ff4757; border-color: #ff4757; box-shadow: 0 0 20px #ff4757; color: white; transform: scale(0.9); }
        .pad.active-D { background: #2ed573; border-color: #2ed573; box-shadow: 0 0 20px #2ed573; color: white; transform: scale(0.9); }
        .pad.active-K { background: #ffa502; border-color: #ffa502; box-shadow: 0 0 20px #ffa502; color: white; transform: scale(0.9); }
        .pad.active-L { background: #1e90ff; border-color: #1e90ff; box-shadow: 0 0 20px #1e90ff; color: white; transform: scale(0.9); }

        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 30px;
            background: #110e1a;
            box-shadow: 0 0 15px rgba(46, 213, 115, 0.1);
            outline: none;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #110e1a;
            color: #2ed573;
            border: 2px solid #3d2f5c;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 12px;
            outline: none;
            transition: all 0.2s ease;
            margin-bottom: 15px;
        }

        textarea:focus {
            border-color: #2ed573;
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.2);
        }

        button {
            background: #2ed573;
            color: black;
            border: none;
            padding: 12px 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        button:hover {
            background: #5ed98f;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(46, 213, 115, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .btn-danger:hover {
            background: #ff6b7b;
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4);
        }

        #save-btn {
            background: #2ed573;
            color: black;
            margin-top: 25px;
            font-size: 16px;
        }

        #save-btn:hover {
            background: #5ed98f;
            box-shadow: 0 6px 15px rgba(46, 213, 115, 0.4);
        }
    </style>
</head>
<body>

    <div class="menu-wrapper">
        <a href="menu.html" class="nav-back" style="margin-top: 20px; display: inline-block;">⬅️ Volver al Menú Principal</a>
        
        <h1 id="game-title" style="color: #2ed573; text-shadow: 0 0 20px rgba(46, 213, 115, 0.4); margin-top: 25px; font-size: 38px;">🎙️ CREADOR DE NIVELES 🎙️</h1>
        <div class="welcome-subtitle" style="margin-bottom: 30px;">Selecciona una canción en MP3, ponle un nombre, dale a Play y presiona las teclas al ritmo.</div>

        <div class="container">
            <div id="audio-panel">
                <div class="file-select-zone" onclick="document.getElementById('audio-file').click()">
                    <p id="file-label" style="margin: 0; font-weight: bold; color: #2ed573;">🎵 Haz clic para seleccionar tu canción (.mp3)</p>
                    <input type="file" id="audio-file" accept="audio/*">
                </div>
                
                <label style="align-self: flex-start; margin-bottom: 8px; color: #a5b1c2; font-size: 14px;">Nombre de la canción en el juego:</label>
                <input type="text" id="song-name" placeholder="Ej: Mi Canción Favorita">

                <audio id="audio-player" controls></audio>
                <div style="margin-top: 15px; color: #a5b1c2; font-size: 14px;" id="track-time">Tiempo: 0.00s</div>
                
                <button id="save-btn">💾 Guardar Canción en el Juego</button>
            </div>

            <div id="editor-panel">
                <h3 style="margin-top:0; color: #2ed573; text-shadow: 0 0 10px rgba(46, 213, 115, 0.2);">Teclas (S, D, K, L)</h3>
                <div class="pad-container">
                    <div id="pad-S" class="pad">S</div>
                    <div id="pad-D" class="pad">D</div>
                    <div id="pad-K" class="pad">K</div>
                    <div id="pad-L" class="pad">L</div>
                </div>
                <p style="color: #a5b1c2;">Notas grabadas: <strong id="note-count" style="color: #2ed573; font-size: 18px; text-shadow: 0 0 10px rgba(46, 213, 115, 0.3);">0</strong></p>
                <textarea id="json-output" readonly placeholder="El código JSON aparecerá aquí automáticamente..."></textarea>
                <button onclick="clearMap()" class="btn-danger">Reiniciar Mapa</button>
            </div>
        </div>

    <script>
        const audioInput = document.getElementById('audio-file');
        const audioPlayer = document.getElementById('audio-player');
        const fileLabel = document.getElementById('file-label');
        const trackTimeTxt = document.getElementById('track-time');
        const songNameInput = document.getElementById('song-name');
        
        let generatedMap = [];
        let selectedFileName = "";
        const validKeys = ['S', 'D', 'K', 'L'];

        // Cargar archivo de audio local
        audioInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFileName = file.name;
                fileLabel.innerText = "🎵 Cargado: " + file.name;
                // Auto-rellenar el nombre quitando la extensión .mp3
                songNameInput.value = file.name.replace(/\.[^/.]+$/, ""); 
                audioPlayer.src = URL.createObjectURL(file);
                clearMap(false);
            }
        });

        // Mostrar el tiempo transcurrido
        audioPlayer.addEventListener('timeupdate', () => {
            trackTimeTxt.innerText = `Tiempo: ${audioPlayer.currentTime.toFixed(2)}s`;
        });

        // Capturar pulsaciones
        window.addEventListener('keydown', (e) => {
            if (!audioPlayer.src || audioPlayer.paused) return;
            const key = e.key.toUpperCase();
            if (validKeys.includes(key)) {
                e.preventDefault(); 
                const exactTime = parseFloat(audioPlayer.currentTime.toFixed(3));
                
                // Evitar spam por mantener pulsada la tecla
                if (generatedMap.length > 0) {
                    const lastNote = generatedMap[generatedMap.length - 1];
                    if (lastNote.key === key && Math.abs(lastNote.time - exactTime) < 0.05) return;
                }

                generatedMap.push({ time: exactTime, key: key });
                generatedMap.sort((a, b) => a.time - b.time);
                updateUI(key);
            }
        });

        // Quitar la animación visual al soltar la tecla
        window.addEventListener('keyup', (e) => {
            const key = e.key.toUpperCase();
            if (validKeys.includes(key)) {
                const pad = document.getElementById(`pad-${key}`);
                if (pad) pad.className = `pad`;
            }
        });

        function updateUI(activeKey) {
            const pad = document.getElementById(`pad-${activeKey}`);
            if (pad) pad.classList.add(`active-${activeKey}`);
            document.getElementById('note-count').innerText = generatedMap.length;
            document.getElementById('json-output').value = JSON.stringify(generatedMap);
        }

        function clearMap(askConfirm = true) {
            if (askConfirm && !confirm("¿Seguro que quieres borrar todas las notas actuales?")) return;
            generatedMap = [];
            document.getElementById('note-count').innerText = "0";
            document.getElementById('json-output').value = "";
        }

        // Guardar la canción en localStorage
        document.getElementById('save-btn').addEventListener('click', () => {
            const title = songNameInput.value.trim();
            if (!title) {
                alert("Por favor, ponle un nombre a la canción.");
                return;
            }
            if (generatedMap.length === 0) {
                alert("Primero debes grabar algunas notas antes de guardar.");
                return;
            }

            const customSong = {
                name: title,
                fileName: selectedFileName,
                map: generatedMap
            };

            let savedSongs = JSON.parse(localStorage.getItem('custom_rhythm_songs')) || [];
            
            const existingIndex = savedSongs.findIndex(s => s.name === title);
            if(existingIndex !== -1) {
                if(!confirm("Ya existe una canción con este nombre. ¿Quieres sobrescribirla?")) return;
                savedSongs[existingIndex] = customSong;
            } else {
                savedSongs.push(customSong);
            }

            localStorage.setItem('custom_rhythm_songs', JSON.stringify(savedSongs));
            alert(`¡Canción "${title}" guardada con éxito! Ya puedes volver al juego a probarla.`);
        });
    </script>
    </div>
</body>
</html>
