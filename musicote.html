<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Rhythm Battle Arena - Modo Musicote</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-back {
            display: inline-block;
            margin-top: 15px;
            color: #a5b1c2;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .nav-back:hover { color: #00d2d3; }
        
        #musicote-current-badge {
            position: absolute;
            top: 12px;
            left: 15px;
            color: rgba(0, 210, 211, 0.85);
            font-size: 13px;
            font-weight: bold;
            z-index: 5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 210, 211, 0.4);
        }

        .song-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 210, 211, 0.15);
            border-radius: 5px;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }
        
        .song-entry:hover, .song-entry.selected {
            background: rgba(0, 210, 211, 0.08);
            border-color: #00d2d3;
            transform: translateX(2px);
        }

        .song-entry.selected {
            box-shadow: 0 0 10px rgba(0, 210, 211, 0.2);
        }

        .song-entry .title {
            font-weight: bold;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .song-entry .notes-count {
            font-size: 11px;
            color: #00d2d3;
            background: rgba(0, 210, 211, 0.1);
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: bold;
        }

        .musicote-theme-btn {
            background: #00d2d3 !important;
            color: black !important;
        }

        .musicote-theme-btn:hover {
            background: #00e8e9 !important;
            box-shadow: 0 0 15px rgba(0, 210, 211, 0.4) !important;
        }

        .musicote-theme-btn.muted {
            background: #555 !important;
            color: #aaa !important;
            box-shadow: none !important;
        }

        #song-list::-webkit-scrollbar {
            width: 4px;
        }
        #song-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        #song-list::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 211, 0.3);
            border-radius: 2px;
        }
        #song-list::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 210, 211, 0.5);
        }
    </style>
</head>
<body>

    <h1 id="game-title" style="color: #00d2d3; text-shadow: 0 0 15px rgba(0, 210, 211, 0.6);">🎵 RHYTHM ARENA: MUSICOTE 🎵</h1>
    
    <div id="battle-ui" style="border-color: #00d2d3; box-shadow: 0 0 25px rgba(0, 210, 211, 0.1);">
        <div class="ui-box">
            <h3 id="heart-title">❤️ Tu Vida</h3>
            <div id="player-hearts" style="color: #ff4757; font-size: 28px; letter-spacing: 2px;">❤️❤️❤️</div>
        </div>
        
        <div id="boss-zone">
            <div id="boss-active-ui">
                <h3 id="song-name-display" style="color: #00d2d3; margin: 0 0 5px 0;">Selecciona una canción</h3>
                <div id="boss-health-bar" style="border-color: #00d2d3;"><div id="boss-health-fill" style="background: #00d2d3; width: 0%;"></div></div>
                <div id="boss-dialogue">Usa el panel de la derecha para elegir tu reto.</div>
            </div>
            <div id="game-message" style="display: none;"></div>
        </div>

        <div class="ui-box">
            <h3 id="score-title" style="color: #00d2d3;">🎯 Notas Acertadas</h3>
            <div id="combo-counter" style="font-size: 24px; font-weight: bold; color: #00d2d3;">0</div>
        </div>
    </div>

    <div id="main-layout" style="display: flex; justify-content: center; align-items: flex-start; max-width: 900px; margin: 10px auto;">
        <div id="game-area">
            <button id="start-btn" style="background: #00d2d3; color: black; display: none;">¡Empezar Canción!</button>
            
            <div id="game-container" style="border-color: #00d2d3; box-shadow: 0 0 30px rgba(0, 210, 211, 0.15);">
                <div id="musicote-current-badge">FALLOS: 0 / 3</div>
                
                <div id="lane-S" class="lane"></div>
                <div id="lane-D" class="lane"></div>
                <div id="lane-K" class="lane"></div>
                <div id="lane-L" class="lane"></div>
                
                <div id="hit-bar"></div>
                
                <div class="key-indicator" style="left:0%;">S</div>
                <div class="key-indicator" style="left:25%;">D</div>
                <div class="key-indicator" style="left:50%;">K</div>
                <div class="key-indicator" style="left:75%;">L</div>
            </div>
            
            <a href="menu.html" class="nav-back">⬅️ Volver al Menú Principal</a>
        </div>

        <div id="musicote-panel" style="width: 280px; min-height: 600px; background: #161224; border: 4px solid #00d2d3; border-radius: 10px; margin-left: 20px; box-sizing: border-box; display: flex; flex-direction: column; padding: 20px 15px; box-shadow: 0 0 25px rgba(0, 210, 211, 0.15);">
            <h3 style="margin: 0 0 15px 0; color: #00d2d3; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 0 10px rgba(0, 210, 211, 0.4); font-weight: bold; text-align: center;">🎵 CANCIONES</h3>
            
            <div id="song-list" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; max-height: 320px; padding-right: 2px; margin-bottom: 20px;">
                <!-- Cargar dinámicamente -->
            </div>

            <div id="song-details" style="display: none; border-top: 2px dashed rgba(0, 210, 211, 0.2); padding-top: 15px; text-align: left;">
                <h4 id="detail-song-name" style="margin: 0 0 8px 0; color: #00d2d3; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">-</h4>
                <p style="margin: 5px 0; font-size: 13px; color: #a5b1c2;">Notas: <strong id="detail-song-notes" style="color: white;">0</strong></p>
                <p style="margin: 5px 0; font-size: 13px; color: #a5b1c2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Audio: <span id="detail-song-audio" style="font-style: italic; font-size: 12px; color: #70a1ff;">-</span></p>
                
                <div id="audio-upload-container" style="margin-top: 15px; padding: 15px; background: #110e1a; border: 2px dashed rgba(0, 210, 211, 0.4); border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s ease;" onclick="document.getElementById('audio-file').click()">
                    <p id="upload-label" style="font-size: 12px; margin: 0; font-weight: bold; color: #00d2d3;">📂 Cargar MP3</p>
                    <input type="file" id="audio-file" accept="audio/*" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <!-- Reproductor de audio invisible para la partida -->
    <audio id="audio-player" style="display: none;"></audio>

    <!-- Botón flotante para silenciar efectos/música de fondo si los hubiera (cumple con unificación) -->
    <button id="mute-music-btn" class="mute-music-btn musicote-theme-btn">🎵</button>

    <!-- Lógica del Modo Musicote -->
    <script src="musicote.js"></script>
</body>
</html>
